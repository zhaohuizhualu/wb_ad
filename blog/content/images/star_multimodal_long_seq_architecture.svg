<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1620" viewBox="0 0 1800 1620"><rect width="1800" height="1620" fill="#ffffff"/><polyline points="900.0,214 900.0,262" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="900.0,262 895.95,253.0 904.05,253.0" fill="#64748b"/><polyline points="900.0,374 241.5,412 241.5,442" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="241.5,442 237.45,433.0 245.55,433.0" fill="#64748b"/><polyline points="900.0,374 680.5,412 680.5,442" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="680.5,442 676.45,433.0 684.55,433.0" fill="#64748b"/><polyline points="900.0,374 1119.5,412 1119.5,442" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="1119.5,442 1115.45,433.0 1123.55,433.0" fill="#64748b"/><polyline points="900.0,374 1558.5,412 1558.5,442" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="1558.5,442 1554.45,433.0 1562.55,433.0" fill="#64748b"/><polyline points="1670,214 1670,224 1768,224 1768,430 1720,430 1720,442" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="7 5"/><polygon points="1720,442 1715.95,433.0 1724.05,433.0" fill="#0891b2"/><polyline points="1560,214 1560,238 1782,238 1782,424 1251,424 1251,442" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="7 5"/><polygon points="1251,442 1246.95,433.0 1255.05,433.0" fill="#0891b2"/><polyline points="1119.5,646 1119.5,668 980,668 980,700" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="980,700 975.95,691.0 984.05,691.0" fill="#64748b"/><polyline points="1558.5,646 1558.5,682 820,682 820,700" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="820,700 815.95,691.0 824.05,691.0" fill="#64748b"/><polyline points="1160,775 1196,775" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5"/><polygon points="1196,775 1187.0,779.05 1187.0,770.95" fill="#ea580c"/><polyline points="600,850 600,930" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="600,930 595.95,921.0 604.05,921.0" fill="#64748b"/><polyline points="1296,936 1296,990 1160,990" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5"/><polygon points="1160,990 1169.0,985.95 1169.0,994.05" fill="#ea580c"/><polyline points="600,1120 600,1200" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="600,1200 595.95,1191.0 604.05,1191.0" fill="#64748b"/><polyline points="241.5,646 241.5,664 14,664 14,1250 40,1250" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="40,1250 31.0,1254.05 31.0,1245.95" fill="#64748b"/><polyline points="680.5,646 680.5,678 28,678 28,1300 40,1300" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="40,1300 31.0,1304.05 31.0,1295.95" fill="#64748b"/><polyline points="1396,936 1396,1250 1160,1250" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5"/><polygon points="1160,1250 1169.0,1245.95 1169.0,1254.05" fill="#ea580c"/><polyline points="600,1350 600,1430" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="600,1430 595.95,1421.0 604.05,1421.0" fill="#64748b"/><text x="40" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1e293b">star_multimodal_long_seq  (cpl_ctr_base)</text><text x="40" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#64748b">DeepFM skeleton  +  STAR 2-domain topology  +  PPNet gates  +  SimTier multimodal stats  +  GSU/ESU long-sequence attention</text><rect x="40" y="110" width="1720" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="42" y="124" width="5" height="76" rx="2" fill="#2563eb"/><text x="900.0" y="144" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">01  Sample inputs</text><text x="900.0" y="174" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">139 one-hot slots (dense_ids)  |  76 multi-hot sequence slots (sparse_ids + idx0, &lt;= 200 items each)</text><text x="900.0" y="199" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">dense vector: mm_simscores_long [B, 200]  =  multimodal similarity scores: current ad vs. user long-term behavior items</text><rect x="40" y="262" width="1720" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="42" y="276" width="5" height="84" rx="2" fill="#2563eb"/><text x="900.0" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">02  Hash + shared lookup + pooling</text><text x="900.0" y="326" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">hash id -&gt; [1, 50,000,000)  |  fm_w [50M] (1st-order weights)  |  fm_v [50M, 8] (shared embeddings)</text><text x="900.0" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">multi-hot: unique + segment_sum, then sqrt pooling (sum / sqrt(valid length));  mask: id &gt;= 1</text><rect x="40" y="442" width="403" height="204" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="42" y="456" width="5" height="176" rx="2" fill="#0891b2"/><text x="241.5" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">03a  Wide (first-order)</text><text x="241.5" y="506" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">gather fm_w at wide slots</text><text x="241.5" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">[B, 139]</text><rect x="479" y="442" width="403" height="204" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="481" y="456" width="5" height="176" rx="2" fill="#0891b2"/><text x="680.5" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">03b  FM (second-order)</text><text x="680.5" y="506" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">0.5 * ( (sum E)^2 - sum E^2 )</text><text x="680.5" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">over wide-slot embeddings</text><text x="680.5" y="556" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">[B, 8]</text><rect x="918" y="442" width="403" height="204" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="920" y="456" width="5" height="176" rx="2" fill="#0891b2"/><text x="1119.5" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">03c  SimTier statistics</text><text x="1119.5" y="506" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">200 scores -&gt; 20-bin histogram</text><text x="1119.5" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">(0.05..0.95) + valid_ratio</text><text x="1119.5" y="556" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">log1p smooth + LayerNorm</text><text x="1119.5" y="581" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">[B, 21]</text><rect x="1357" y="442" width="403" height="204" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="1359" y="456" width="5" height="176" rx="2" fill="#0891b2"/><text x="1558.5" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">03d  GSU + ESU attention</text><text x="1558.5" y="506" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">GSU: sim &gt;= 0.3, top_k = 20</text><text x="1558.5" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">ESU: 4-head target attention</text><text x="1558.5" y="556" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">target = slot 2 (cust_uid emb)</text><text x="1558.5" y="581" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">att = gamma1*attn + gamma2*relu(sim)</text><text x="1558.5" y="606" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">+ timediff slots 990/991 -&gt; LN</text><text x="1558.5" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">[B, 32]</text><text x="1440" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#0891b2">mm_simscores bypass (dashed)</text><rect x="40" y="700" width="1120" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="42" y="714" width="5" height="122" rx="2" fill="#7c3aed"/><text x="600.0" y="734" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">04  Deep input assembly</text><text x="600.0" y="764" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">flatten deep slots: 215 x 8 = 1720   +   SimTier 21</text><text x="600.0" y="789" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">BatchNorm   -&gt;   concat ESU attention 32   =   [B, 1773]</text><text x="600.0" y="814" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">(SimTier enters BEFORE BN; attention output enters AFTER BN)</text><rect x="1196" y="700" width="564" height="236" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="1198" y="714" width="5" height="208" rx="2" fill="#ea580c"/><text x="1478.0" y="734" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">05  PPNet gate context (shared)</text><text x="1478.0" y="764" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">FC512( stop_grad(deep_inputs) )</text><text x="1478.0" y="789" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">+ BN( ppnet_slot emb: 13 slots = 104 )</text><text x="1478.0" y="814" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">= context [B, 616]</text><text x="1478.0" y="839" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">GateNu(ctx, O): FC(min(512,O)) relu</text><text x="1478.0" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">-&gt; FC(O) sigmoid -&gt; x2  in (0, 2)</text><text x="1478.0" y="889" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">4 layer gates shared by domains,</text><text x="1478.0" y="914" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">+ 1 last-layer gate PER domain</text><rect x="40" y="930" width="1120" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="42" y="944" width="5" height="162" rx="2" fill="#16a34a"/><text x="600.0" y="964" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">06  STAR topology FCN  (2 domains)</text><text x="600.0" y="994" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">domain = ps_id (slot 21) -&gt; HashTable: 6 video ps_ids -&gt; domain 0, else domain 1</text><text x="600.0" y="1019" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">per-domain kernel/bias, shared input:  1773 -&gt; 128 -&gt; 128 -&gt; 128 -&gt; 32</text><text x="600.0" y="1044" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">each layer input gated by shared PPNet gate (element-wise x)</text><text x="600.0" y="1069" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">domain output [B, 32] -&gt; last layer</text><text x="1312" y="982" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#ea580c">layer gates</text><rect x="40" y="1200" width="1120" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="42" y="1214" width="5" height="122" rx="2" fill="#16a34a"/><text x="600.0" y="1234" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">07  Domain-wise last layer</text><text x="600.0" y="1264" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">concat [ Wide 139 | FM 8 | FCN 32 | auxiliary emb 6 slots = 48 ] = 227</text><text x="600.0" y="1289" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">x per-domain PPNet gate_L  -&gt;  per-domain Linear(227, 1)  -&gt;  logit_d</text><text x="600.0" y="1314" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">logit = sum_d ( domain_indicator_d * logit_d )</text><text x="1412" y="1242" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#ea580c">gate_L x2</text><rect x="300" y="1430" width="600" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="302" y="1444" width="5" height="68" rx="2" fill="#dc2626"/><text x="600.0" y="1464" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#1e293b">08  Output</text><text x="600.0" y="1494" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">pred = sigmoid(logit) x outter_cali (=1.0)</text><text x="600.0" y="1519" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748b">export signature: DeepFM-out/pred_mul:0</text><text x="40" y="1570" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#64748b">Disabled in this config: EPNet (emb_personalized_slot empty), transformer_to_deep, SID semantic-ID channels, auxiliary_network.</text><text x="40" y="1596" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#64748b">Loss: sigmoid cross-entropy on logits + L2(linear/embedding 1e-7)  |  Optimizer: Adagrad lr=0.015 (accumulator 1e-4), 1 epoch per hourly window.</text></svg>